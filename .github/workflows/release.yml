name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag; leave empty to validate the selected branch
        required: false
        type: string
      publish:
        description: Publish the tagged version
        required: true
        type: boolean
        default: false
      registry:
        description: Registry to publish or verify
        required: true
        type: choice
        default: all
        options:
          - all
          - openvsx
          - marketplace

permissions:
  contents: read

concurrency:
  group: remote-ports-release
  cancel-in-progress: false

jobs:
  release:
    name: Release (${{ matrix.registry }})
    strategy:
      fail-fast: false
      matrix:
        registry: ${{ fromJSON(inputs.registry == 'openvsx' && '["openvsx"]' || inputs.registry == 'marketplace' && '["marketplace"]' || '["openvsx","marketplace"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: publish
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY: ${{ matrix.registry }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Validate release identity
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const read = file => JSON.parse(readFileSync(file, 'utf8'));
          const root = read('package.json');
          for (const kind of ['local', 'remote']) {
            const extension = read(`packages/${kind}/package.json`);
            if (extension.version !== root.version || extension.publisher !== '00index') {
              throw new Error('Release versions and publisher must match.');
            }
          }
          if (process.env.PUBLISH_RELEASE === 'true') {
            if (process.env.GITHUB_REPOSITORY !== '00INDEX/RemotePortForward') {
              throw new Error('Publishing is restricted to the upstream repository.');
            }
            if (process.env.RELEASE_TAG !== `v${root.version}`) {
              throw new Error(`Publishing requires the existing tag v${root.version}.`);
            }
          }
          JS
      - run: npm ci
      - name: Check and package
        run: npm run package:registry -- --publisher 00index
      - name: Verify release packages
        run: node scripts/publish.mjs --check --preflight --registry "$REGISTRY"
      - name: Publish and verify registry downloads
        if: github.event_name == 'push' || inputs.publish == true
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: node scripts/publish.mjs --registry "$REGISTRY"
